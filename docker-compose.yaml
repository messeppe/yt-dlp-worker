services:
  daily-report:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    environment:
      TZ: Asia/Jakarta
      SUPABASE_DB_URL: '${SUPABASE_DB_URL}'
      EMAILIT_API_KEY: '${EMAILIT_API_KEY}'
      REPORT_FROM: '${REPORT_FROM}'
      REPORT_TO: '${REPORT_TO}'
      DASHBOARD_URL: '${DASHBOARD_URL}'
    restart: unless-stopped
    labels:
      - app=videomasjid
      - service=yt-daily-report
    networks:
      - default
      - supabase_net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  default:
  supabase_net:
    name: gy2d24tm9ablk9t4aaiqt2ac
    external: true
