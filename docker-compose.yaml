services:
  yt-scout:
    build: .
    command: python scout.py
    labels:
      - traefik.enable=false
      - app=videomasjid
      - service=yt-scout
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY}
      RAPIDAPI_HOST: ${RAPIDAPI_HOST}
      MAX_VIDEO_QUALITY: ${MAX_VIDEO_QUALITY:-720}
      POLL_INTERVAL: ${POLL_INTERVAL:-5}
      MAX_SCOUT_RETRIES: ${MAX_SCOUT_RETRIES:-10}
      MAX_SUBTITLE_QUEUE: ${MAX_SUBTITLE_QUEUE:-10}
      MIN_SUBTITLE_QUEUE: ${MIN_SUBTITLE_QUEUE:-3}
      PROXY_URL: ${PROXY_URL}
      PROXY_POOL_SIZE: ${PROXY_POOL_SIZE:-100}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  yt-media-mule:
    build: .
    command: python media_mule.py
    labels:
      - traefik.enable=false
      - app=videomasjid
      - service=yt-media-mule
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY}
      RAPIDAPI_HOST: ${RAPIDAPI_HOST}
      POLL_INTERVAL: ${POLL_INTERVAL:-5}
      MAX_SCOUT_RETRIES: ${MAX_SCOUT_RETRIES:-10}
      PROXY_URL: ${PROXY_URL}
      PROXY_POOL_SIZE: ${PROXY_POOL_SIZE:-100}
      MAX_ATTEMPTS_PER_VIDEO: ${MAX_ATTEMPTS_PER_VIDEO:-20}
      MAX_RETRIES: ${MAX_RETRIES:-10}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      WORKER_COUNT: ${WORKER_COUNT:-20}
      WORKER_ID: media-mule
    restart: unless-stopped
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  yt-subtitle-mule:
    build: .
    command: python subtitle_mule.py
    labels:
      - traefik.enable=false
      - app=videomasjid
      - service=yt-subtitle-mule
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY}
      RAPIDAPI_HOST: ${RAPIDAPI_HOST}
      POLL_INTERVAL: ${POLL_INTERVAL:-5}
      MAX_SCOUT_RETRIES: ${MAX_SCOUT_RETRIES:-10}
      MAX_SUBTITLE_QUEUE: ${MAX_SUBTITLE_QUEUE:-10}
      MIN_SUBTITLE_QUEUE: ${MIN_SUBTITLE_QUEUE:-3}
      PROXY_URL: ${PROXY_URL}
      PROXY_POOL_SIZE: ${PROXY_POOL_SIZE:-100}
      MAX_RETRIES: ${MAX_RETRIES:-10}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      SUBTITLE_WORKER_COUNT: ${SUBTITLE_WORKER_COUNT:-20}
      WORKER_ID: subtitle-mule
    restart: unless-stopped
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
