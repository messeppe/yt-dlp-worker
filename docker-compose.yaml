services:

  yt-api-scout:
    build: .
    command: ["python", "-u", "scout.py"]
    labels:
      - traefik.enable=false
    environment:
      WORKER_ID: scout
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY}
      RAPIDAPI_HOST: ${RAPIDAPI_HOST}
      MAX_VIDEO_QUALITY: ${MAX_VIDEO_QUALITY:-720}
      POLL_INTERVAL: ${POLL_INTERVAL:-5}
      MAX_SCOUT_RETRIES: ${MAX_SCOUT_RETRIES:-10}
      MAX_SUBTITLE_QUEUE: ${MAX_SUBTITLE_QUEUE:-10}
      MIN_SUBTITLE_QUEUE: ${MIN_SUBTITLE_QUEUE:-3}
    restart: unless-stopped
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: "service=scout,app=videomasjid"

  yt-media-mule-1:
    build: .
    command: ["python", "-u", "media_mule.py"]
    labels:
      - traefik.enable=false
    environment:
      WORKER_ID: media-mule-1
      PROXY_URL: ${PROXY_URL}
      PROXY_POOL_SIZE: ${PROXY_POOL_SIZE:-100}
      MAX_ATTEMPTS_PER_VIDEO: ${MAX_ATTEMPTS_PER_VIDEO:-20}
      MAX_SCOUT_RETRIES: ${MAX_SCOUT_RETRIES:-10}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
    restart: unless-stopped
    tmpfs:
      - /tmp
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: "service=media-mule,instance=1,app=videomasjid"

