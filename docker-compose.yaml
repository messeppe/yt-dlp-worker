services:
  daily-report:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    environment:
      TZ: Asia/Jakarta
      SUPABASE_DB_URL: '${SUPABASE_DB_URL}'
      EMAILIT_API_KEY: '${EMAILIT_API_KEY}'
      REPORT_FROM: '${REPORT_FROM}'
      REPORT_TO: '${REPORT_TO}'
      DASHBOARD_URL: '${DASHBOARD_URL}'
    restart: unless-stopped
    labels:
      - app=videomasjid
      - service=yt-daily-report
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
